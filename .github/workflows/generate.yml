name: Create README
description: Create README
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
jobs:
  make-readme:
    name: "Generate the README"
    runs-on: ubuntu-slim
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v7
      # TODO create-github-app-token to allow pushing around restrictions
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Create new README
        run: go run main.go
      - name: setup and configure gitsign
        run: |
          wget https://github.com/sigstore/gitsign/releases/download/v0.17.1/gitsign_0.17.1_linux_amd64.deb
          sudo dpkg -i gitsign_0.17.1_linux_amd64.deb
          git config --global gpg.x509.program gitsign
          git config --global gpg.format x509
          git config --global commit.gpgsign true
          git config --global tag.gpgsign true
      - name: Push new README
        env:
          GITSIGN_OIDC_MODE: ambient
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f README.md
          git diff --staged --quiet && exit 0
          git commit -m '[gh-action] Daily Encounter'
          git push origin HEAD:main

